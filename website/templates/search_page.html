<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Search page</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" type="text/css" href="../static/search_page.css"/>
    <script>src="../static/javascript/review_rendering.js"</script>
</head>
<body id="search_page_format">

<div class ='header_bar'>
    <img class="header_bar_elements" id="header_bar_logo" src="../static/wmgzon_logo.png" alt="WMGzon logo"/>
    <form action="{{url_for('search')}}" method="post" class="header_bar_elements"><input id="header_bar_search" type="text" placeholder="Search products" name="search_string"/></form>
    <div class ="header_bar_elements" style="padding-left: calc(33.3% - 155px)">
        <a href="/account_page"><img id="header_bar_account" src="../static/account.png" alt="Account" href="../../website/web_pages/account_page.html"/> </a>
        <a href="/basket"><img id="header_bar_basket" src="../static/basket.png" alt="Basket" href="../../website/web_pages/basket_page.html"/> </a>
    </div>
</div>

<!-- The sub-header below contains links to product category pages and should be used globally across the site. -->
<div class="category_bar">
    <a class="category_bar_elements" style="background: rgba(183,241,167,0.5)" href="/groceries_page.html">Groceries</a>
    <a class="category_bar_elements" style="background: rgba(192,188,188,0.5)" href="/electronics_page.html">Electronics</a>
    <a class="category_bar_elements" style="background: rgba(210,184,245,0.5)" href="/songs_page.html">Songs</a>
    <a class="category_bar_elements" style="background: rgba(241,160,111,0.5)" href="/books_page.html">Books</a>
    <a class="category_bar_elements" style="background: rgba(241,224,86,0.5)" href="/jewellery_page.html">Jewellery</a>
    <a class="category_bar_elements" style="background: rgba(146,241,225,0.5)" href="/movies_page.html">Movies</a>
</div>

<!-- The divide below contains the content for the entire page -->
<div id="search_area">

    <!--The divide below contains the search filters which sit on the left hand side of the page -->
    <div id="search_filters">

    </div>

    <!--The divide below contains the search results which sit on the right hand side of the page -->
    <div id="search_results">

    </div>

</div>













</body>
<script>
    let search_results = JSON.parse('{{search_results|tojson|safe}}');
    search_items = search_results.search_results;
    average_ratings = search_results.average_ratings;
    unique_categories = search_results.unique_categories;
    unique_genres = search_results.unique_genres;
    unique_authors = search_results.unique_authors;
    unique_media_types = search_results.unique_media_types;



    function display_search_results(search_results){
        let search_results_divide = document.getElementById("search_results");
        let counter = 0;
        for (let product of search_results){
            let search_result_link = document.createElement("a");
            let search_result_module = document.createElement("div");
            let search_result_image = document.createElement("img");
            let search_result_attributes = document.createElement("div");
            let search_result_title = document.createElement("h5");
            let search_result_price = document.createElement("h6");
            let search_result_rating = document.createElement("span");
            let search_result_stock = document.createElement("h6");
            let search_result_category = document.createElement("h6");
            search_result_module.classList.add('search_result_module');
            search_result_image.classList.add('search_result_image');
            search_result_attributes.classList.add('search_result_attributes');
            search_result_link.classList.add('search_result_link');
            search_result_link.href = `product/${product[0]}`;
            search_result_image.src = product[2];
            search_result_image.alt = product[1];
            search_result_title.innerHTML = product[1];
            search_result_price.innerHTML = "£" + product[6] + " | " + product[16]*100 + "% off";
            search_result_stock.innerHTML = "Only " + product[15] + " left in stock";
            search_result_category.innerHTML = "Category: " + product[4];
            search_results_divide.appendChild(search_result_link);
            search_result_link.appendChild(search_result_module);
            search_result_module.appendChild(search_result_image);
            search_result_module.appendChild(search_result_attributes);
            search_result_attributes.appendChild(search_result_title);
            search_result_attributes.appendChild(document.createElement('br'));
            search_result_attributes.appendChild(search_result_price);
            search_result_attributes.appendChild(document.createElement('br'));
            search_result_attributes.appendChild(search_result_stock);
            search_result_attributes.appendChild(document.createElement('br'));
            search_result_attributes.appendChild(search_result_category);
            search_result_attributes.appendChild(document.createElement('br'));
            search_result_attributes.appendChild(search_result_rating);
            display_rating(average_ratings[counter][1], search_result_rating);
            counter += 1;
        }
    }

    function display_filters(unique_list, list_heading){
        let filter_form = document.createElement('div');
        filter_form.classList.add('filter_form');
        let filter_heading = document.createElement('h5');
        filter_heading.innerHTML = list_heading;
        document.getElementById('search_filters').appendChild(filter_form);
        filter_form.appendChild(filter_heading);
        for (let item of unique_list){
            let filter_option = document.createElement('div');
            let filter_checkbox = document.createElement('input');
            filter_checkbox.setAttribute('type', 'checkbox');
            filter_checkbox.setAttribute('name', item);
            filter_checkbox.setAttribute('id', list_heading + item);
            filter_checkbox.addEventListener('click', checkbox_listener.bind(search_items, list_heading, item));
            let filter_label = document.createElement('label');
            filter_label.setAttribute('for', list_heading + item);
            filter_label.innerHTML = item;
            filter_form.appendChild(filter_option);
            filter_option.appendChild(filter_checkbox);
            filter_option.appendChild(filter_label);
        }
    }

    function checkbox_listener(search_items, filter_name, filter_value){
        updated_search_items = [];
        if(filter_name === "Genre") {
            for (let item of search_items){
                if (item[10] === filter_value) {
                    updated_search_items.push(item);
                }
            }
        }
                else if(filter_name === "Category") {
            for (let item of search_items) {
                if (item[4] === filter_value) {
                    updated_search_items.push(item);
                }
            }
        }
        else if(filter_name === "Authors") {
            for (let item of search_items) {
                if (item[8] === filter_value) {
                    updated_search_items.push(item);
                }
            }
        }
        else if(filter_name === "Media types") {
            for (let item of search_items) {
                if (item[9] === filter_value) {
                    updated_search_items.push(item);
                }
            }
        }
        else if(filter_name === "Languages") {
            for (let item of search_items) {
                if (item[11] === filter_value) {
                    updated_search_items.push(item);
                }
            }
        }
        search_items = updated_search_items;
        display_search_results(search_items);

    }


    function display_rating(average_rating, parent_element){
        for (let i = 1; i <= average_rating; i++){
            let star = document.createElement('img');
            star.src = "../static/yellow_star.png";
            star.classList.add('rating_stars');
            parent_element.appendChild(star);
        }
        for(let j = 1; j <= 5 - average_rating; j++){
            let star = document.createElement('img');
            star.src = "../static/grey_star.png";
            star.classList.add('rating_stars');
            parent_element.appendChild(star);
        }
    }



    display_search_results(search_items);
    display_filters(search_results.unique_genres, "Genre");
    display_filters(search_results.unique_authors, "Authors");
    display_filters(search_results.unique_media_types, "Media types");
    display_filters(search_results.unique_categories, "Categories");
    display_filters(search_results.unique_languages, "Languages");

</script>
</html>
