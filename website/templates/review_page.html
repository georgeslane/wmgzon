<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" type="text/css" href="../static/stylesheets/forms.css"/>
    <link rel="stylesheet" type="text/css" href="../static/stylesheets/website_header.css"/>
    <title>Review</title>
</head>
<body id="background">
<!-- The header bar below contains the logo, search bar, and account and basket links and should be used globally across the site -->
<div class ='header_bar'>
    <a href="/" class ='header_bar_elements'><img id="header_bar_logo" src="../static/images/wmgzon_logo.png" alt="WMGzon logo"/> </a>
    <form action="{{url_for('search')}}" method="post" class="header_bar_elements"><input id="header_bar_search" type="text" placeholder="Search products" name="search_string"/></form>
    <div class ="header_bar_elements" style="padding-left: calc(33.3% - 155px)">
        <a href="/account"><img id="header_bar_account" src="../static/images/account.png" alt="Account" href="../../website/web_pages/account_page.html"/> </a>
        <a href="/basket"><img id="header_bar_basket" src="../static/images/basket.png" alt="Basket" href="../../website/web_pages/basket_page.html"/> </a>
    </div>
</div>

<!-- The sub-header below contains links to product category pages and should be used globally across the site. -->
<div class="category_bar">
    <a class="category_bar_elements" style="background: rgba(183,241,167,0.5)" href="/groceries_page.html">Groceries</a>
    <a class="category_bar_elements" style="background: rgba(192,188,188,0.5)" href="/electronics_page.html">Electronics</a>
    <a class="category_bar_elements" style="background: rgba(210,184,245,0.5)" href="/songs_page.html">Songs</a>
    <a class="category_bar_elements" style="background: rgba(241,160,111,0.5)" href="/books_page.html">Books</a>
    <a class="category_bar_elements" style="background: rgba(241,224,86,0.5)" href="/jewellery_page.html">Jewellery</a>
    <a class="category_bar_elements" style="background: rgba(146,241,225,0.5)" href="/movies_page.html">Movies</a>
</div>
<div id="content">
  <h3>Leave a review</h3>
  <form id="form" action="" method="post">
    <input type="text" class="form_input" name="review_heading" placeholder="Review heading" value="{{request.form.review_heading}}" required/>
    <input type="number" min="0" max="5" class="form_input" style="width: 50%" name="rating" placeholder="Rating" value="{{request.form.rating}}" required/>
    <input type="text" class="form_input" style="height: 100px; width: 200px" name="review_text" placeholder="Review text" value="{{request.form.review_text}}" required/>
    <input type="submit" class="form_input" name="submit"/>
  </form>
</div>
</body>
</html>
